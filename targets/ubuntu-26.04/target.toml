# The ubuntu-26.04 target (ADR-0023). nl-shell reads this file at start-up
# (src/nl_shell/targets.py) to choose and describe the active target.
#
#   id                   the target id; must equal this folder's name
#   display_name         the name `:status` shows
#   shell                the shell nl-shell drives; `bash` is the only accepted value
#   package_owner_query  argv that asks the package manager which package owns a file
#                        (the file path is appended); the gate's package-owner test (ADR-0013)
#   [os_release]         the exact os-release(5) `ID` and `VERSION_ID` this target matches;
#                        no `ID_LIKE` or nearby-version fallback
#   [sudo]               the sudo implementation on this OS and the version nl-shell's sudo
#                        handling was checked against (ADR-0015)
#   [command_provider]   optional: local data naming the package that provides a command, for
#                        the "command not found" suggestion. `format` is the kind of source
#                        (only `sqlite`), `path` the absolute path of the file (opened
#                        read-only, never fetched; ADR-0003), `query` one SQL statement with a
#                        single `?` for the command word that returns package names in its
#                        first column. Here: the command-not-found database, tables
#                        commands(command, pkgID) and packages(pkgID, name). When the file is
#                        absent or unreadable, no package is named.

id = "ubuntu-26.04"
display_name = "Ubuntu 26.04 LTS"
shell = "bash"
package_owner_query = ["dpkg", "-S"]

[os_release]
ID = "ubuntu"
VERSION_ID = "26.04"

[sudo]
implementation = "sudo-rs"
version = "0.2.13"

[command_provider]
format = "sqlite"
path = "/var/lib/command-not-found/commands.db"
query = """
SELECT packages.name FROM commands JOIN packages ON packages.pkgID = commands.pkgID
WHERE commands.command = ? ORDER BY packages.name"""
