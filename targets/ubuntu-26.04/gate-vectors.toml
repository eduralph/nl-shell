# This file holds the rows that can be asserted with the command layer still a stub
# (#196): nothing is read-only yet, so a row whose expected class is read-only in the spec
# appears here with `mutating` and the reason "not allowlisted" and is updated by #198.
# #192 (live-session resolution) adds the rows that need a session.
#
# Keys: command, origin ("proposal" | "typed"), rejected; class (required unless
# rejected, absent when rejected); optional reason (a substring some reason must
# contain), label (the model's label) and row (the spec's row number).

