# Weekly version updates for the actions the workflows pin to commit hashes.
# Each entry waits 7 days after a release before proposing it (cooldown), so brand-new
# releases get a week to show problems. Security updates ignore the cooldown.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
