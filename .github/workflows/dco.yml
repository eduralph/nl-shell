name: dco

# Every commit in a pull request must carry a DCO 'Signed-off-by' line. No paths
# filter, so it reports a `dco` status on every PR (docs-only ones included) and
# can serve as a required status check without leaving a PR stuck "pending".
# Re-runs on each push, so adding the sign-off clears the check.

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      - name: Require a DCO sign-off on every commit
        run: |
          set -uo pipefail
          commits=$(gh api "repos/$REPO/pulls/$PR/commits" --paginate --jq '.[].sha')
          fail=0
          for sha in $commits; do
            msg=$(gh api "repos/$REPO/commits/$sha" --jq '.commit.message')
            if ! printf '%s\n' "$msg" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::commit $sha is missing a DCO 'Signed-off-by' line"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Every commit must be signed off (git commit -s). See CONTRIBUTING.md and the DCO file."
            exit 1
          fi
          echo "OK: all commits carry a DCO sign-off"
