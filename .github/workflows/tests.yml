name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install --quiet -e '.[dev]'
      - name: Run the test suite
        run: python -m pytest

  # The session (src/nl_shell/session.py) runs `bash` from PATH, and bash versions differ in
  # what the hooks see (e.g. when job notices are printed). Run the suite on every supported
  # release, built from pinned GNU source by scripts/build_bash.py.
  bash:
    name: pytest (bash ${{ matrix.bash }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bash: ["5.1", "5.2", "5.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cache
        with:
          path: ~/bash-${{ matrix.bash }}
          key: bash-${{ matrix.bash }}-${{ runner.os }}-${{ hashFiles('scripts/build_bash.py') }}
      - name: Build bash ${{ matrix.bash }}
        if: steps.cache.outputs.cache-hit != 'true'
        run: python -I scripts/build_bash.py "${{ matrix.bash }}" ~/bash-${{ matrix.bash }}
      - name: Install
        run: python -m pip install --quiet -e '.[dev]'
      - name: Run the test suite
        run: |
          export PATH="$HOME/bash-${{ matrix.bash }}/bin:$PATH"
          bash -c 'echo "bash $BASH_VERSION"'
          python -m pytest
