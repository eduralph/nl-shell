name: Docs checks

# Enforces ADR-0001 (docs/design/adr/0001-record-architecture-decisions.md:22-23, :30-31):
# frozen design records (Accepted/Superseded ADRs, non-draft proposals and specs) are never
# edited, except for a listed status-line change. It also checks that relative Markdown
# links resolve (scripts/docs_links.py).
# No path filter, so the job always reports and can be made a required check.
# `pull_request` only, never `pull_request_target`: this runs PR-supplied code.
on:
  pull_request:

permissions:
  contents: read

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      # Runs the BASE commit's copy of scripts/docs_checks.py, so a PR cannot switch off
      # its own check by editing the script. Only the PR that first adds the script (it is
      # not on the base yet) runs the PR's copy.
      # `python -I` (isolated mode) keeps the PR checkout off sys.path and ignores PYTHON*
      # env vars, so a PR cannot plant a module such as `re.py` that the script would
      # import in place of the standard library.
      - name: Frozen design records are unchanged
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE:scripts/docs_checks.py" 2>/dev/null; then
            echo "Running scripts/docs_checks.py from the base commit $BASE"
            git show "$BASE:scripts/docs_checks.py" | python -I - immutability "$BASE" "$HEAD"
          else
            echo "scripts/docs_checks.py is not on the base; running the PR's copy"
            python -I scripts/docs_checks.py immutability "$BASE" "$HEAD"
          fi
      # The checkers' own tests, so a change to one is tested before it gates anything.
      - name: Test the checkers
        run: python3 -I -m unittest discover -s .github/docs-check -v
      # Each step runs the BASE commit's copy of its checker, so a PR cannot switch off
      # its own check by editing it. Only the PR that first adds a checker runs its own
      # copy. `-I` (isolated mode) keeps the checkout off sys.path, so a PR cannot plant
      # a module such as `re.py` that the checker would import instead of the stdlib.
      - name: Relative links resolve
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CHECKER: .github/docs-check/docs_links.py
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE:$CHECKER" 2>/dev/null; then
            echo "Running $CHECKER from the base commit $BASE"
            git show "$BASE:$CHECKER" | python3 -I -
          else
            echo "$CHECKER is not on the base; running the PR's copy"
            python3 -I "$CHECKER"
          fi
      - name: ADR index matches the ADRs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CHECKER: .github/docs-check/adr_index.py
        run: |
          set -euo pipefail
          if git cat-file -e "$BASE:$CHECKER" 2>/dev/null; then
            echo "Running $CHECKER from the base commit $BASE"
            git show "$BASE:$CHECKER" | python3 -I -
          else
            echo "$CHECKER is not on the base; running the PR's copy"
            python3 -I "$CHECKER"
          fi
