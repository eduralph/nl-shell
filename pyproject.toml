[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nl-shell"
version = "0.0.0"
description = "Natural-language shell: a small local model proposes commands, bash runs them"
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "Eduard Ralph", email = "eduard@ralphovi.net" }]
requires-python = ">=3.12"
dependencies = [
    "prompt_toolkit>=3.0",
    "ptyprocess>=0.7",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
nl-shell = "nl_shell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Tests import from src/ directly, never from an installed copy, so a test always runs
# against the tree it sits in (the PDCA gates run it inside a patched worktree).
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "sudo: needs real sudo-rs; runs only in the reference VM (NL_SHELL_TEST_VM=1)",
    "vm: needs the throwaway reference VM (NL_SHELL_TEST_VM=1)",
    "gpu: needs a GPU (NL_SHELL_TEST_GPU=1)",
    "teacher: calls the teacher endpoint (NL_SHELL_TEST_TEACHER=1)",
]
